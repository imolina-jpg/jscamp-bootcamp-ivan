<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>DevJobs</title>
    <meta name="description" content="Portal de empleo especializado en el sector tecnológico.">
    <link rel="icon" type="image/png" href="icon_DevJobs.png">
    <link rel="stylesheet" href="styles.css">

    <script type="module" src="./devjobs-avatar-element.js"></script>
     <script type="module" src="./AplicarBoton.js"></script>
     <script type="module" src="./Fetch-data.js"></script>
     <script type="module" src="./Filtros.js"></script>
     <script type="module" src="./search.js"></script>


</head>

<body>

    <nav>
        <header>
            <div class="Logo">
                <!-- Las imágenes pueden tener un cierre de etiqueta en la de apertura, además, es recomendable tener los atributos width y height para mantener la relación de aspecto de la imagen previo a que esta cargue -->
                <img src="carambola.svg" alt="Logo de DebJobs" id="Logo" width="100" height="100" />
            </div>

            <div class="Menu">
                <a href="index.html">Buscar</a>
                <a href="#">Empleos</a>
                <a href="#">Empresas</a>
                <a href="#">Salarios</a>
            </div>

            <div class="esquina-derecha">
                <button class="botones" href="#">Subir CV</button>
                <!-- Es importante que las imágenes tengan el atributo `alt` para que puedan ser leídas por los lectores de pantalla -->
                <img id="Perfil" src="user-circle.svg" alt="Avatar genérico del usuario" width="100" height="100" />
            </div>
        </header>
    </nav>

    <main>
        <!-- La pagina se divide en dos secciones, la búsqueda de empleos y los resultados de la búsqueda -->
        <section class="seccion-de-busqueda">
            <h1>Encuentra tu próximo trabajo</h1>
            <p>Explora miles de oportunidades en el sector tecnológico</p>

            <!-- El propósito del formulario es buscar empleos, por lo que su role tiene sentido que sea `search`. Por otro lado, como su objetivo es ese, tiene sentido que los select estén dentro de él -->
            <form class="Buscador" role="search">
                <div class="input-search-box">
                    <label for="BuscadorEmpleo"><img id="lupa" src="search.svg" alt="Lupa de búsqueda"></label>
                <input type="text" id="BuscadorEmpleo" name="Buscador"
                    placeholder="Buscar trabajos, empresas o habilidades" />
                </div>
                <div class="Filtros">
                    <select name="Tecnologia" id="Tecnologia">
                        <option value="">Tecnología</option>
                        <option value="JavaScript">JavaScript</option>
                        <option value="React">React</option>
                        <option value="Node.js">Node.js</option>
                    </select>

<!-- Se puede usar optgroup para agrupar opciones-->

                    <select name="Ubicacion" id="Ubicacion">
                        <!-- Es importante que el texto de los valores no tengan espacios ni caracteres especiales, esto porque luego se enviarán por JS y puede dar error -->
                        <option value="">Ubicación</option>
                        <option value="Remoto">Remoto</option>
                        <option value="Presencial">Presencial</option>
                        <option value="Híbrido">Híbrido</option>
                    </select>

                    <!-- El `name` y el `id` también tienen que evitar espacios y caracteres especiales -->
                    <select name="Tipo_de_contrato" id="Tipo_de_contrato">
                        <option value="">Tipo de contrato</option>
                        <option value="Tiempo completo">Tiempo completo</option>
                        <option value="Medio tiempo">Medio tiempo</option>
                        <option value="Contrato">Contrato</option>
                    </select>

                    <select name="Nivel_de_experiencia" id="Nivel_de_experiencia">
                        <option value="">Nivel de experiencia</option>
                        <option value="Junior">Junior</option>
                        <option value="Mid-level">Mid-level</option>
                        <option value="Senior">Senior</option>
                    </select>
                </div>
            </form>
        </section>
        <section>
            <h2>Resultados de la búsqueda</h2>
            <div class="MarcoJobs">
                <!-- Más que una tabla, se puede interpretar como un lista de resultados -->
                <ul class="jobs-listing">
                    <!-- Aquí es donde se van a renderizar los empleos desde JavaScript vía json-->
                </ul>  
            </div>
        </section>
    </main>

    <nav class="pagination">
          <!--
        Cuando un anchor o button no tiene texto dentro que indique el propósito del elemento, debemos de alguna manera indicar cual es, para eso se recomienda usar los atributos:
        aria-label, que indica a los lectores de pantalla cual es el propósito del elemento
        title, que muestra un tooltip con su valor cuando el usuario hace hover sobre el elemento
        -->
        <a href="#" aria-label="Ir a la página de resultados anterior" title="Anterior"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-left">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M15 6l-6 6l6 6" />
            </svg></a>
        <a class="is-active" href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>
        <a href="#" aria-label="Ir a la página de resultados siguiente" title="Siguiente"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-chevron-right">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M9 6l6 6l-6 6" />
            </svg></a>
    </nav>



    <footer>
        <p>© 2024 DevJobs. Todos los derechos reservados.</p>
    </footer>

</body>

</html>
